name: Python Package CI

on: [push]

permissions:
  # Important for at least docker gha cache
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  test-pytest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install package dependencies from the requirements.txt file so they are cached by Github Actions
      run: pip install -r requirements.txt

    - name: Install the package and it's dependencies for testing
      run: make install-test

    - name: Run all the pytest tests
      run: make test-pytest

  test-formatting-linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install package dependencies from the requirements.txt file so they are cached by Github Actions
      run: pip install -r requirements.txt

    - name: Install the package and it's dependencies for testing
      run: make install-test

    - name: Test that Python import statements are correctly ordered and formatted
      run: make test-isort

    - name: Check that Black formatting is correct, fails if not
      run: make test-black

    - name: Test that flake8 linter is passing, fails if not
      run: make test-flake8

    - name: Test that pylint linter is passing, fails if not
      run: make test-pylint


    - name: Test that docker linter is passing, fails if not
      run: make test-docker-lint


  release:
    needs: [test-pytest, test-formatting-linting]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # configure ssh key with github for use in 'publish release' step
        ssh-key: ${{ secrets.GITHUB_BOT_SSH_KEY }}
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        role-to-assume: arn:aws:iam::123456789012:role/github-oidc-role
        role-session-name: githubactionssession
        role-duration-seconds: 1200
        aws-region: 'us-east-1'

    - name: login to aws codeartifact (read only)
      run: make code-artifact-read-access

    - name: Setup dependencies for doing a release
      run: pip install .[release]

    - name: Configure Git Bot user
      run: |
        git config --global user.email "github-bot@example.com"
        git config --global user.name "GitHub Bot"

    - name: login to aws codeartifact (write)
      run: aws codeartifact login --tool twine --repository python-packages --domain code-artifacts --domain-owner 123456789012 --region us-east-1

    - name: publish release
      run: |
        if semantic-release print-version --next 2>&1 | grep -q "No release will be made."; then
          echo "No semantic commit messages found, forcing minor version update"
          semantic-release publish --minor -v DEBUG -D branch=main
        else
          echo "Founnd semantic commit message, generating new major/minor/patch version using this"
          semantic-release publish -v DEBUG -D branch=main
        fi


    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-flags: --debug

    - name: Login in to AWS ECR
      run: make docker-login

    - name: Expose GH cache URLs & token
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Docker build
      run: |
        make docker-build

    - name: Run the integration test on the built image
      run: make docker-test

    - name: Push docker image to AWS ECR
      run: make docker-push

