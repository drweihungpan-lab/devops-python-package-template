[metadata]
name = example
version = attr: example.__version__
author = John Doe
author_email = j.doe@example.com
description = A small example package
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/your-org/packaging_tutorial
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

install_requires =
    click

[options.extras_require]
    test = isort; black; flake8; flake8-print; pylint; pytest; pytest-cov
    dev = pip-tools
    release = python-semantic-release==7.34.6; build

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
        example = example.scripts.example_script:example_cli

# Options for black-flake8 compatability
[flake8]
max-line-length = 88
exclude = .venv

[semantic_release]
# where to read/write the version number
version_variable = src/example/__init__.py:__version__

build_command = python -m build --sdist --wheel

# Setting the repository to codeartifact means repo details are
# used from the ~/.pypirc file
# This file is generated when we login into aws codeartifact
repository = codeartifact
upload_to_repository = true

# Format the commit message so that we don't trigger another build
# See https://docs.github.com/en/actions/managing-workflow-runs/skipping-workflow-runs
commit_message = "{version} [skip ci]"
