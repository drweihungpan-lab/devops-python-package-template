[metadata]
name = {{cookiecutter.package_name}}
version = attr: {{cookiecutter.package_name}}.__version__
author = {{cookiecutter.author}}
author_email = {{cookiecutter.author_email}}
description = Predict the date each device reaches its usage limit (synthetic data)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/your-org/{{cookiecutter.repo_name}}
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12

install_requires =
    click
    numpy
    pandas

[options.extras_require]
test = isort; black; flake8; flake8-print; pylint; pytest; pytest-cov
release = python-semantic-release==7.34.6; build

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    {{cookiecutter.package_name}} = {{cookiecutter.package_name}}.scripts.{{cookiecutter.package_name}}_script:{{cookiecutter.package_name}}_cli

# Options for black-flake8 compatibility
[flake8]
max-line-length = 88
exclude = .venv

# OPTIONAL: automated versioning, switched on by the instructor.
# It reads Conventional Commit prefixes, bumps the version, tags the commit and
# creates a GitHub Release. Nothing is uploaded to PyPI or any other registry.
[semantic_release]
version_variable = src/{{cookiecutter.package_name}}/__init__.py:__version__
build_command = python -m build --sdist --wheel
upload_to_pypi = false
upload_to_release = true
commit_message = "{version} [skip ci]"
