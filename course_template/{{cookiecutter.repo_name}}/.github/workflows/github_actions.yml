{% raw %}name: Python Package CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-formatting-linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the package and its dependencies for testing
      run: make install-test

    - name: Test that Python import statements are correctly ordered and formatted
      run: make test-isort

    - name: Check that Black formatting is correct, fails if not
      run: make test-black

    - name: Test that flake8 linter is passing, fails if not
      run: make test-flake8

    - name: Test that pylint linter is passing, fails if not
      run: make test-pylint

    - name: Check that the installed command runs
      run: |
        {% endraw %}{{cookiecutter.package_name}}{% raw %} --input data/device_counts.csv --output limits.csv
        head -n 4 limits.csv

