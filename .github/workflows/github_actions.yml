name: Python Package Template CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies for testing the package
      run: pip install -r requirements.txt
     
    - name: Test that the cookiecutter template reproduces the example package
      run: make test-template

    - name: Test that the example package installs correctly
      run: make test-example-package

  course-template:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install cookiecutter
      run: pip install -r requirements.txt

    - name: Test that the course template generates a package that passes its own checks
      run: make test-course-template
